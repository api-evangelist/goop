name: Goop
description: Goop is a modern lifestyle and wellness brand founded in 2008 by Gwyneth
  Paltrow, launched from her kitchen as a weekly email newsletter and grown into a
  content-and-commerce company spanning editorial journalism, e-commerce, and its
  own product lines across beauty, skincare, supplements, food, fashion, home, and
  travel. Goop operates goop.com as a curated online shop and digital magazine, publishes
  wellness and beauty guidance, and sells goop-branded product lines (including goopglow
  and goop Beauty) alongside a curated marketplace of third-party brands. It is a privately
  held company backed by Lightspeed Venture Partners (Series C, 2017) and other investors.
  Goop does not currently operate a public developer program or API; this profile captures
  its company identity and public web surface for the API Evangelist network.
